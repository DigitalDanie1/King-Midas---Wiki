<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Midas Codex — Game Wiki</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#0a0a0f; --bg2:#12121c; --panel:#15151f; --panel2:#1c1c2a;
  --line:#2a2a3c; --line2:#353548;
  --txt:#e8e8f0; --txt2:#a0a0b8; --txt3:#6a6a82;
  --gold:#f5c451; --gold2:#e0a020; --goldglow:rgba(245,196,81,.35);
  --accent:#8b5cf6; --accent2:#6d3fd4;
  --radius:14px;
  --live:#34d399; --integrated:#38bdf8; --prod:#a78bfa; --dev:#fbbf24;
  --maint:#fb923c; --retired:#f87171; --notstarted:#8b8ba0; --copyright:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(139,92,246,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(245,196,81,.07), transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:'Noto Sans','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  line-height:1.55; min-height:100vh; letter-spacing:.1px;
  transition:background .22s ease;
}
body[data-status-filter="Live"]{
  background:
    radial-gradient(1100px 650px at 78% -12%, rgba(52,211,153,.28), transparent 62%),
    radial-gradient(850px 520px at -8% 8%, rgba(52,211,153,.14), transparent 58%),
    linear-gradient(180deg, rgba(9,44,33,.38), transparent 48%),
    var(--bg);
}
body[data-status-filter="Retired"]{
  background:
    radial-gradient(1100px 650px at 78% -12%, rgba(248,113,113,.30), transparent 62%),
    radial-gradient(850px 520px at -8% 8%, rgba(248,113,113,.14), transparent 58%),
    linear-gradient(180deg, rgba(58,16,20,.42), transparent 48%),
    var(--bg);
}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#454560}

/* ===== Masthead ===== */
.masthead{
  position:relative; display:grid; grid-template-columns:minmax(360px,1fr) minmax(390px,520px);
  gap:28px; align-items:start; padding:30px 28px 24px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(139,92,246,.06), transparent);
  overflow:hidden;
}
body[data-status-filter="Live"] .masthead{
  border-bottom-color:rgba(52,211,153,.36);
  background:linear-gradient(180deg, rgba(52,211,153,.10), transparent);
}
body[data-status-filter="Retired"] .masthead{
  border-bottom-color:rgba(248,113,113,.38);
  background:linear-gradient(180deg, rgba(248,113,113,.12), transparent);
}
.masthead-main{position:relative;z-index:2;max-width:720px}
.watermark{
  position:absolute; right:24px; top:50%; transform:translateY(-50%);
  font-weight:800; font-size:80px; letter-spacing:0;
  color:transparent; -webkit-text-stroke:1px rgba(245,196,81,.06);
  pointer-events:none; user-select:none; white-space:nowrap;
}
.brand{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.crest{
  width:46px;height:46px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:grid;place-items:center;font-size:24px;font-weight:900;color:#1a1205;
  box-shadow:0 0 24px var(--goldglow), inset 0 1px 2px rgba(255,255,255,.4);
}
.title-wrap h1{
  font-size:26px; font-weight:800; letter-spacing:.5px;
  background:linear-gradient(90deg,#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.title-wrap .sub{font-size:12.5px;color:var(--txt2);letter-spacing:2px;text-transform:uppercase}
.title-wrap .sub b{color:var(--gold);font-weight:700}

.searchbar{
  margin-top:20px; position:relative; max-width:720px;
}
.searchbar input{
  width:100%; padding:15px 18px 15px 48px; font-size:16px;
  background:var(--panel2); border:1px solid var(--line2); border-radius:12px;
  color:var(--txt); outline:none; transition:.2s;
}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.searchbar input::placeholder{color:var(--txt3)}
.searchbar .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.searchbar .hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--txt3);
  border:1px solid var(--line2);padding:2px 7px;border-radius:6px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;display:flex;align-items:center;gap:9px;font-size:13px;
}
.stat b{font-size:17px;font-weight:800}
.stat .dot{width:9px;height:9px;border-radius:50%}

/* ===== Layout ===== */
.shell{display:flex;gap:0;align-items:flex-start}
.rail{
  width:250px;flex:none;padding:22px 18px;position:sticky;top:0;
  height:100vh;overflow-y:auto;border-right:1px solid var(--line);
}
.rail h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt3);
  margin:18px 0 9px;font-weight:700}
.rail h3:first-child{margin-top:0}
.facet{display:flex;flex-direction:column;gap:3px}
.fbtn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px;border-radius:8px;font-size:13.5px;color:var(--txt2);
  cursor:pointer;border:1px solid transparent;transition:.12s;user-select:none;
}
.fbtn:hover{background:var(--panel);color:var(--txt)}
.fbtn.active{background:var(--panel2);color:var(--txt);border-color:var(--line2)}
body[data-status-filter="Live"] .fbtn.active{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.46);color:#d9fff0}
body[data-status-filter="Retired"] .fbtn.active{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.50);color:#ffe1e1}
.fbtn .cnt{font-size:11px;color:var(--txt3);background:var(--bg2);padding:1px 7px;border-radius:20px}
.fbtn .lead{display:flex;align-items:center;gap:8px}
.fbtn .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.reset{margin-top:14px;font-size:12px;color:var(--txt3);cursor:pointer;text-align:center;
  padding:8px;border:1px dashed var(--line2);border-radius:8px}
.reset:hover{color:var(--gold);border-color:var(--gold2)}
.status-defs{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.status-def{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(21,21,31,.55)}
.status-def .st{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:12.5px;font-weight:800;color:var(--txt)}
.status-def .sdot{width:8px;height:8px;border-radius:50%;flex:none}
.status-def .sd{font-size:11.5px;line-height:1.45;color:var(--txt3)}
.status-defs-top{position:relative;z-index:2;width:100%;padding:14px;border:1px solid rgba(255,255,255,.08);
  border-radius:12px;background:rgba(10,10,15,.56);backdrop-filter:blur(10px);box-shadow:0 12px 35px rgba(0,0,0,.24)}
.status-defs-top h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt3);
  margin:0 0 10px;font-weight:800}
.status-defs-top .status-defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0}
.status-defs-top .status-def{padding:9px 10px;background:rgba(20,20,30,.82);border-color:rgba(255,255,255,.10)}
.status-defs-top .status-def .st{font-size:12px;margin-bottom:4px}
.status-defs-top .status-def .sd{font-size:11px;line-height:1.4;color:#a9a9bf}
body[data-status-filter="Live"] .status-defs-top{border-color:rgba(52,211,153,.28);box-shadow:0 0 0 1px rgba(52,211,153,.08),0 16px 42px rgba(52,211,153,.10)}
body[data-status-filter="Retired"] .status-defs-top{border-color:rgba(248,113,113,.32);box-shadow:0 0 0 1px rgba(248,113,113,.10),0 16px 42px rgba(248,113,113,.12)}

.main{flex:1;padding:22px 26px 60px;min-width:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.count-lbl{font-size:14px;color:var(--txt2)}
.count-lbl b{color:var(--txt)}
.sortsel{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  padding:8px 12px;border-radius:9px;font-size:13px;outline:none;cursor:pointer}

/* ===== Grid of entries ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;transition:.16s;position:relative;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);border-color:var(--line2);
  box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(139,92,246,.15)}
.thumb{aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{width:100%;height:100%;display:grid;place-items:center;font-size:44px;font-weight:900;
  color:rgba(255,255,255,.85);text-shadow:0 2px 10px rgba(0,0,0,.4)}
.retired-x{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;
  color:rgba(248,113,113,.92);background:rgba(0,0,0,.42);text-shadow:0 4px 22px rgba(0,0,0,.75);
  z-index:2;pointer-events:none}
.sbadge{
  position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  padding:3px 9px;border-radius:20px;backdrop-filter:blur(6px);
  background:rgba(10,10,15,.55);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;gap:5px;text-transform:uppercase;z-index:3;
}
.sbadge .sdot{width:7px;height:7px;border-radius:50%}
.gtag{position:absolute;top:9px;right:9px;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  padding:3px 8px;border-radius:6px;background:rgba(10,10,15,.6);color:var(--gold);
  border:1px solid rgba(245,196,81,.25);text-transform:uppercase;z-index:3}
.cbody{padding:12px 13px 14px}
.cname{font-size:14.5px;font-weight:700;line-height:1.3;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;gap:10px;font-size:11.5px;color:var(--txt3);flex-wrap:wrap}
.cmeta span{display:flex;align-items:center;gap:4px}
.vbadge{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  padding:2px 7px;border-radius:6px;vertical-align:middle;border:1px solid}
.editions{display:flex;flex-direction:column;gap:8px}
.edrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;
  border:1px solid var(--line2);border-radius:10px;background:var(--panel2);cursor:pointer;transition:.13s}
.edrow:hover{border-color:var(--accent);background:var(--panel)}
.edrow.current{border-color:var(--gold2);background:rgba(245,196,81,.07);cursor:default}
.edrow .el{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.edrow .er{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--txt3)}
.edtag{font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:6px;border:1px solid}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--txt3)}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.5}

/* ===== Article overlay ===== */
.overlay{position:fixed;inset:0;z-index:100;display:none}
.overlay.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(4,4,8,.72);backdrop-filter:blur(4px)}
.article{
  position:absolute;top:0;right:0;height:100%;width:min(920px,100%);
  background:var(--bg);border-left:1px solid var(--line2);overflow-y:auto;
  box-shadow:-30px 0 80px rgba(0,0,0,.6);animation:slidein .28s cubic-bezier(.2,.7,.2,1);
}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.closebtn{position:sticky;top:0;float:right;margin:14px;z-index:5;
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--txt);font-size:18px;cursor:pointer;
  display:grid;place-items:center;transition:.15s}
.closebtn:hover{background:var(--retired);color:#fff;border-color:var(--retired)}

.hero{position:relative;padding:30px 34px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(139,92,246,.08),transparent)}
.hero-top{display:flex;gap:22px;align-items:flex-start}
.hero-icon{width:120px;height:120px;flex:none;border-radius:16px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.5);background:var(--bg2)}
.hero-icon img{width:100%;height:100%;object-fit:cover}
.hero-icon .ph{width:100%;height:100%;display:grid;place-items:center;font-size:52px;font-weight:900;color:#fff}
.hero-info{flex:1;min-width:0}
.hero-info h2{font-size:30px;font-weight:800;line-height:1.15;margin-bottom:4px}
.hero-native{font-size:14px;color:var(--txt2);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--txt2);display:flex;align-items:center;gap:6px}
.chip.status{font-weight:700;color:#fff}
.chip .sdot{width:8px;height:8px;border-radius:50%}

/* article body: two column with infobox */
.abody{padding:26px 34px 60px;display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:start}
.acontent{min-width:0}
.sec{margin-bottom:26px}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700;
  display:flex;align-items:center;gap:8px}
.sec p{color:var(--txt2);font-size:14.5px;line-height:1.7}
.featlist{white-space:pre-line;color:var(--txt2);font-size:14px;line-height:1.8}
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{font-size:12.5px;padding:6px 12px;border-radius:9px;background:rgba(139,92,246,.12);
  border:1px solid rgba(139,92,246,.3);color:#c4b5fd;font-weight:600}

/* infobox */
.infobox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  overflow:hidden;position:sticky;top:16px}
.ib-head{padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;
  font-weight:700;color:var(--gold);background:linear-gradient(180deg,rgba(245,196,81,.10),transparent);
  border-bottom:1px solid var(--line)}
.ib-row{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;
  font-size:13px;border-bottom:1px solid var(--line)}
.ib-row:last-child{border-bottom:none}
.ib-row .k{color:var(--txt3)}
.ib-row .v{color:var(--txt);font-weight:600;text-align:right}
.ib-big{display:flex;padding:0}
.ib-big .cell{flex:1;padding:14px 10px;text-align:center;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.ib-big .cell:last-child{border-right:none}
.ib-big .cell .lab{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);margin-bottom:4px}
.ib-big .cell .num{font-size:18px;font-weight:800;color:var(--gold)}

/* cert + lang grids */
.certgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.certcell{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px 13px}
.certcell .cn{font-size:12px;color:var(--txt2);margin-bottom:5px}
.certcell .cv{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.langcell{padding:9px;border-radius:9px;text-align:center;font-size:12px;font-weight:600;
  border:1px solid var(--line2)}
.langcell.on{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);color:#6ee7b7}
.langcell.off{background:var(--bg2);color:var(--txt3);opacity:.55}
.langcell .lm{font-size:14px;margin-top:2px}
.linkbtns{display:flex;gap:10px;flex-wrap:wrap}
.lbtn{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  display:flex;align-items:center;gap:8px;transition:.15s;border:1px solid transparent}
.lbtn:hover{box-shadow:0 6px 20px rgba(139,92,246,.4);transform:translateY(-2px)}
.lbtn.ghost{background:var(--panel2);border-color:var(--line2);color:var(--txt2)}
.namesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.namecell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.namecell .nl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);margin-bottom:3px}
.namecell .nv{font-size:13.5px;color:var(--txt)}

.footer{padding:26px;text-align:center;color:var(--txt3);font-size:12px;border-top:1px solid var(--line)}
.footer b{color:var(--gold)}
.datasource{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:3px 8px;border:1px solid var(--line2);
  border-radius:20px;background:var(--panel);color:var(--txt2);font-size:11px}
.datasource .dot{width:7px;height:7px;border-radius:50%;background:var(--dev)}
.datasource.live .dot{background:var(--live)}
.datasource.error .dot{background:var(--retired)}

@media(max-width:1180px){
  .masthead{grid-template-columns:minmax(360px,1fr) minmax(360px,460px);gap:22px}
  .status-defs-top .status-def .sd{font-size:10.5px}
}
@media(max-width:900px){
  .masthead{display:block}
  .abody{grid-template-columns:1fr}
  .infobox{position:static}
  .rail{display:none}
  .watermark{display:none}
  .masthead-main{max-width:none}
  .status-defs-top{width:auto;margin-top:18px}
  .status-defs-top .status-defs{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="masthead">
  <div class="watermark">KoreanDaniel</div>
  <div class="masthead-main">
    <div class="brand">
      <div class="crest">♛</div>
      <div class="title-wrap">
        <h1>KING MIDAS CODEX</h1>
        <div class="sub">The Game Encyclopedia · curated by <b>KoreanDaniel</b></div>
      </div>
    </div>
    <div class="searchbar">
      <span class="ico">🔍</span>
      <input id="q" type="text" placeholder="Search any game — name, theme, feature, status, market…" autocomplete="off">
      <span class="hint">/ to focus</span>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="status-defs-top" id="statusDefsTop"></div>
</div>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <div class="toolbar">
      <div class="count-lbl" id="countLbl"></div>
      <select class="sortsel" id="sort">
        <option value="name">Sort: A–Z</option>
        <option value="new">Sort: Newest live</option>
        <option value="rtp">Sort: Highest RTP</option>
        <option value="status">Sort: By status</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="footer">
  <b>King Midas Codex</b> · Built by KoreanDaniel · Data source: Google Sheet · <span id="fcount"></span> game entries
  <span class="datasource" id="dataSourceStatus"><span class="dot"></span><span>Loading sheet...</span></span>
</div>

<div class="overlay" id="overlay">
  <div class="scrim" onclick="closeArticle()"></div>
  <div class="article" id="article"></div>

function setDataSourceStatus(mode,msg){
  const el=document.getElementById("dataSourceStatus");
  if(!el)return;
  el.className=`datasource ${mode||""}`.trim();
  el.querySelector("span:last-child").textContent=msg;
}
function normKey(s){return String(s||"").toLowerCase().replace(/[^a-z0-9가-힣]+/g,"");}
function truthyCell(v){
  if(v===true)return true;if(v===false||v==null||v==="")return false;
  return /^(true|yes|y|1|available|지원|있음|o|✓|✔)$/i.test(String(v).trim());
}
function sheetCell(cell){return cell?(cell.f!=null?cell.f:cell.v):null;}
function rowReader(row,headers){
  const map={};headers.forEach((h,i)=>{if(h)map[normKey(h)]=i;});
  const aliases=(...names)=>{for(const n of names){const k=normKey(n);if(k in map)return sheetCell(row.c[map[k]]);}return null;};
  return aliases;
}
function normalizeStatus(v){
  const s=String(v||"").trim();
  const k=normKey(s);
  const known=Object.keys(STATUS_META||{}).find(x=>normKey(x)===k);
  return known||s||"Not Started";
}
function normalizeRtp(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return v<=1?`${(v*100).toFixed(2)}%`:`${v}%`;
  return String(v);
}
function normalizeSheetGame(row,headers,i){
  const get=rowReader(row,headers);
  const langKeys=Object.keys(LANG_NAMES||{});
  const names={};
  langKeys.forEach(k=>{
    const v=get(`${k} Name`,`${k} Title`,`${k}`,`Name ${k}`,`Title ${k}`);
    if(v!=null&&v!=="")names[k]=String(v);
  });
  const name=get("Name","Game Name","Game","Title","EN","English","EN Name")||names.EN;
  if(!name)return null;
  const languages={};
  langKeys.forEach(k=>{
    const v=get(`${k} Available`,`${k} Language`,`${k} Translation`,`${k} Localisation`,`${k} Localization`,`${k}`);
    languages[k]=truthyCell(v)||Boolean(names[k]);
  });
  const cert={
    UKGC:get("UKGC","UKGC Cert","UKGC Certification"),
    GLI19:get("GLI19","GLI-19","GLI 19","GLI Certification"),
    PAGCOR:get("PAGCOR","PAGCOR Cert","PAGCOR Certification"),
    Peru:get("Peru","Peru GLI","Peru Certification")
  };
  const identifier=String(get("Identifier","Slug","ID","Game ID")||name)
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||`game-${i+1}`;
  return {
    collection:get("Collection","Catalogue","Catalog")||"Google Sheet",
    identifier,name:String(name),names,
    studio:get("Studio","Provider")||"KM",
    gid:get("GID","Game GID","Game ID"),
    exclusivity:get("Exclusivity","Exclusive","Operator"),
    status:normalizeStatus(get("Status","Stage","State")),
    firstLive:get("First Live","Live Date","Launch Date","Released","Release Date"),
    icon:get("Icon","Image","Thumbnail","Key Art","Icon URL","Image URL"),
    logo:get("Logo","Logo URL"),
    rtp:normalizeRtp(get("RTP","Return To Player")),
    highestPayout:get("Highest Payout","Top Payout"),
    maxWin:get("Max Win","MaxWin","Maximum Win"),
    volatility:String(get("Volatility","Vol")||"").toUpperCase()||null,
    commission:get("Commission"),
    hitRate:get("Hit Rate","HitRate"),
    genre:String(get("Genre","Category")||"").toUpperCase()||null,
    tags:get("Tags","Tag"),
    originated:get("Originated","Origin","Country"),
    countryDAU:get("Country DAU","Top DAU","DAU Country"),
    themes:get("Themes","Theme"),
    market:get("Market","Region"),
    description:get("Description","Overview","Desc"),
    gameFeatures:get("Game Features","Features","Feature List"),
    reels:get("Reels","Reel"),
    payways:get("Payways","Pay Ways","Ways"),
    demo:get("Demo","Demo URL","Demo Link"),
    localisation:get("Localisation","Localization","Translation Masterlist"),
    cert,currency:get("Currency","Currencies"),
    features:{},
    languages,
    variant:get("Variant","Build","Edition")||"",
    variantDesc:get("Variant Description","Build Description","Edition Description")||""
  };
}
function gamesFromSheetResponse(resp){
  if(!resp||resp.status==="error")throw new Error(resp&&resp.errors?resp.errors[0].detailed_message:"Google Sheet response error");
  const table=resp.table||{};
  const headers=(table.cols||[]).map(c=>c.label||c.id||"");
  return (table.rows||[]).map((row,i)=>normalizeSheetGame(row,headers,i)).filter(Boolean);
}
function loadGoogleSheet(){
  setDataSourceStatus("", "Loading sheet...");
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    const timeout=setTimeout(()=>reject(new Error("Google Sheet load timed out")),12000);
    window[SHEET_CALLBACK]=resp=>{
      clearTimeout(timeout);
      try{resolve(gamesFromSheetResponse(resp));}
      catch(err){reject(err);}
      finally{script.remove();delete window[SHEET_CALLBACK];}
    };
    script.onerror=()=>{clearTimeout(timeout);delete window[SHEET_CALLBACK];reject(new Error("Google Sheet is not public or cannot be loaded"));};
    script.src=`${SHEET_URL}&cachebust=${Date.now()}`;
    document.head.appendChild(script);
  });
}

function buildSearchIndex(){
  GAMES.forEach(g=>{
    g._search=[g.name,g.identifier,g.status,g.genre,g.studio,g.themes,g.tags,g.market,
      g.countryDAU,g.originated,g.description,g.exclusivity,g.variant,g.variantDesc,g.volatility,
      Object.keys(g.features||{}).join(" "),
      Object.values(g.names||{}).join(" ")].filter(Boolean).join(" ").toLowerCase();
  });
}

function facetCounts(key){
  const base=applyFilters(true,key);
  const m={};
  base.forEach(g=>{let v=g[key];if(key==="collection")v=g.collection;if(v){m[v]=(m[v]||0)+1;}});
  return m;
}
function applyFilters(ignoreSelf,selfKey){
  return GAMES.filter(g=>{
    if(state.q && !g._search.includes(state.q)) return false;
    if(state.status && !(selfKey==="status"&&ignoreSelf) && g.status!==state.status) return false;
    if(state.genre && !(selfKey==="genre"&&ignoreSelf) && g.genre!==state.genre) return false;
    if(state.studio && !(selfKey==="studio"&&ignoreSelf) && g.studio!==state.studio) return false;
    if(state.vol && !(selfKey==="volatility"&&ignoreSelf) && (g.volatility||"").toUpperCase()!==state.vol) return false;
    if(state.collection && !(selfKey==="collection"&&ignoreSelf) && g.collection!==state.collection) return false;
    return true;
  });
}

function fbtn(key,val,cnt,label){

function toggleFacet(key,val){

  render();
}
function resetAll(){state={q:state.q,status:null,genre:null,studio:null,vol:null,collection:null,sort:state.sort};
  render();}

function renderStats(){
  const total=GAMES.length;
  const c={};GAMES.forEach(g=>c[g.status]=(c[g.status]||0)+1);
  const items=[
    ["Total games",total,"var(--gold)"],
    ["Live",c["Live"]||0,"var(--live)"],
    ["Integrated",c["Integrated"]||0,"var(--integrated)"],
    ["In development",(c["Under Development"]||0)+(c["Production Ready"]||0),"var(--dev)"],
    ["Retired / hidden",(c["Retired"]||0)+(c["Maintenance"]||0),"var(--retired)"],
  ];
  document.getElementById("stats").innerHTML=items.map(([l,v,col])=>
    `<div class="stat"><span class="dot" style="background:${col}"></span><b>${v}</b> ${l}</div>`).join("");
  document.getElementById("fcount").textContent=total;
}

function sortGames(list){
  const s=state.sort;
  const arr=[...list];
  if(s==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  else if(s==="new")arr.sort((a,b)=>(b.firstLive||"").localeCompare(a.firstLive||""));
  else if(s==="rtp")arr.sort((a,b)=>rtpNum(b)-rtpNum(a));
  else if(s==="status"){
    arr.sort((a,b)=>(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status))||(a.name||"").localeCompare(b.name||""));}
  return arr;
}

function render(){
  document.body.dataset.statusFilter=(state.status==="Live"||state.status==="Retired")?state.status:"";
  renderRail();
  const list=sortGames(applyFilters(false,null));
  document.getElementById("countLbl").innerHTML=`<b>${list.length}</b> of ${GAMES.length} entries`;
  const grid=document.getElementById("grid");
  if(!list.length){grid.innerHTML=`<div class="empty"><div class="big">🔎</div>No games match your search.<br>Try clearing filters.</div>`;return;}
  grid.innerHTML=list.map((g,i)=>{
    const idx=GAMES.indexOf(g);
    const col=hashColor(g.name);
    const thumb=hasImg(g.icon)
      ? `<img src="${esc(g.icon)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'ph\\' style=\\'background:linear-gradient(135deg,${col},#000)\\'>${initial(g.name)}</div>'">`
      : `<div class="ph" style="background:linear-gradient(135deg,${col},#000)">${initial(g.name)}</div>`;
    return `<div class="card" onclick="openArticle(${idx})">
      <div class="thumb">${thumb}
        ${g.status==="Retired"?`<div class="retired-x">X</div>`:""}
        <div class="sbadge"><span class="sdot" style="background:${statusColor(g.status)}"></span>${esc(g.status||"—")}</div>
        ${g.genre?`<div class="gtag">${esc(g.genre)}</div>`:""}
      </div>
      <div class="cbody">
        <div class="cname">${esc(g.name)}${g.variant?`<span class="vbadge" style="color:${vMeta(g.variant).c};background:${vMeta(g.variant).bg};border-color:${vMeta(g.variant).b}">${g.variant}</span>`:""}</div>
        <div class="cmeta">
          ${g.rtp?`<span>📈 ${esc(g.rtp)}</span>`:""}
          ${g.volatility?`<span>⚡ ${esc(g.volatility)}</span>`:""}
          ${g.maxWin?`<span>🏆 ${esc(g.maxWin)}</span>`:""}
          ${g.gid?`<span>#${esc(g.gid)}</span>`:""}
        </div>
      </div></div>`;
  }).join("");
}

// ---- article ----
function openArticle(idx){
  const g=GAMES[idx];
  const col=hashColor(g.name);
  const heroIcon=hasImg(g.icon)
    ? `<img src="${esc(g.icon)}" onerror="this.parentNode.innerHTML='<div class=\\'ph\\' style=\\'background:linear-gradient(135deg,${col},#000)\\'>${initial(g.name)}</div>'">`
    : `<div class="ph" style="background:linear-gradient(135deg,${col},#000)">${initial(g.name)}</div>`;
  const native=(g.names&&(g.names.CN||g.names.TH||g.names.KR))||"";
  const sm=STATUS_META[g.status]||{};

  // infobox rows
  const ibRows=[
    ["Volatility",g.volatility],["Max Win",g.maxWin],["Highest Payout",g.highestPayout],
    ["Hit Rate",g.hitRate],["Reels",g.reels&&g.reels!=="N.A"?g.reels:null],
    ["Pay Ways",g.payways],["Commission",g.commission&&g.commission!=="N.A"?g.commission:null],
    ["Currency",g.currency],["Origin",g.originated],["Top DAU",g.countryDAU],
    ["Studio",STUDIO_NAMES[g.studio]||g.studio],["Exclusivity",g.exclusivity],
    ["First Live",g.firstLive],["GID",g.gid],["Collection",g.collection],
  ].filter(r=>r[1]!=null&&r[1]!=="");
  const rtpDisp=g.rtp||"—";

  // features
  const flags=Object.keys(g.features||{});
  const featSection=(flags.length||g.gameFeatures)?`<div class="sec"><h4>⭐ Features</h4>
    ${flags.length?`<div class="flags" style="margin-bottom:14px">${flags.map(f=>`<span class="flag">${esc(f)}</span>`).join("")}</div>`:""}
    ${g.gameFeatures?`<div class="featlist">${esc(g.gameFeatures)}</div>`:""}</div>`:"";

  // certifications
  const certs=g.cert||{};
  const certKeys=[["UKGC","UKGC"],["GLI19","GLI-19"],["PAGCOR","PAGCOR"],["Peru","Peru (GLI)"]];
  const anyCert=certKeys.some(([k])=>certs[k]);
  const certSection=anyCert?`<div class="sec"><h4>🛡️ Certifications</h4>
    <div class="certgrid">${certKeys.map(([k,lbl])=>{
      const v=certs[k]||"—";const ok=/certif/i.test(v);const pend=/pend/i.test(v);
      const cc=ok?"var(--live)":pend?"var(--dev)":"var(--txt3)";
      const ic=ok?"✓":pend?"⏳":"—";
      return `<div class="certcell"><div class="cn">${lbl}</div><div class="cv" style="color:${cc}">${ic} ${esc(v)}</div></div>`;
    }).join("")}</div></div>`:"";

  // languages
  const langs=g.languages||{};
  const langKeys=Object.keys(LANG_NAMES);
  const anyLang=langKeys.some(k=>langs[k]);
  const langSection=anyLang?`<div class="sec"><h4>🌐 Language Availability</h4>
    <div class="langgrid">${langKeys.map(k=>{
      const on=langs[k];return `<div class="langcell ${on?'on':'off'}">${LANG_NAMES[k]}<div class="lm">${on?'✓':'·'}</div></div>`;
    }).join("")}</div></div>`:"";

  // localized names
  const nmeta=g.names||{};
  const nameKeys=Object.keys(nmeta).filter(k=>nmeta[k]&&k!=="EN"&&nmeta[k]!=="Live");
  const namesSection=nameKeys.length?`<div class="sec"><h4>🈶 Localized Titles</h4>
    <div class="namesgrid">${nameKeys.map(k=>`<div class="namecell"><div class="nl">${LANG_NAMES[k]||k}</div><div class="nv">${esc(nmeta[k])}</div></div>`).join("")}</div></div>`:"";

  // editions (same-name sibling builds)
  const sibs=GAMES.map((x,ix)=>[x,ix]).filter(([x])=>x!==g && (x.name||"").toLowerCase().trim()===(g.name||"").toLowerCase().trim());
  const edLabel=x=>x.variant?x.variant:"STANDARD";
  const edMeta=x=>x.variant?vMeta(x.variant):{c:"#cfcfe0",bg:"rgba(207,207,224,.1)",b:"var(--line2)"};
  const edRow=(x,ix,cur)=>{const m=edMeta(x);return `<div class="edrow ${cur?'current':''}" ${cur?'':`onclick="openArticle(${ix})"`}>
     <span class="el"><span class="edtag" style="color:${m.c};background:${m.bg};border-color:${m.b}">${edLabel(x)}</span>${cur?'<span style="color:var(--txt3);font-size:11px">▸ viewing</span>':''}</span>
     <span class="er"><span style="color:${statusColor(x.status)}">●</span> ${esc(x.status||'—')} · GID ${esc(x.gid||'—')} · RTP ${esc(x.rtp||'—')}</span></div>`;};
  const editionsSection=sibs.length?`<div class="sec"><h4>🧬 Editions & Builds <span style="color:var(--txt3);font-weight:400;text-transform:none;letter-spacing:0">— same game, different channel/version</span></h4>
    <div class="editions">${edRow(g,idx,true)}${sibs.map(([x,ix])=>edRow(x,ix,false)).join("")}</div></div>`:"";

  // links
  const links=[];
  if(isUrl(g.demo))links.push(`<a class="lbtn" href="${esc(g.demo)}" target="_blank">▶ Play Demo</a>`);
  if(isUrl(g.icon))links.push(`<a class="lbtn ghost" href="${esc(g.icon)}" target="_blank">🖼 Key Art</a>`);
  const linkSection=links.length?`<div class="sec"><h4>🔗 Resources</h4><div class="linkbtns">${links.join("")}</div></div>`:"";

  const themesChips=(g.themes||"").split(/[,/]/).map(t=>t.trim()).filter(Boolean).slice(0,14);

  document.getElementById("article").innerHTML=`
    <button class="closebtn" onclick="closeArticle()">✕</button>
    <div class="hero">
      <div class="hero-top">
        <div class="hero-icon">${heroIcon}</div>
        <div class="hero-info">
          <h2>${esc(g.name)}</h2>
          ${native?`<div class="hero-native">${esc(native)}</div>`:""}
          <div class="chips">
            <span class="chip status" style="background:${statusColor(g.status)}22;border-color:${statusColor(g.status)}66">
              <span class="sdot" style="background:${statusColor(g.status)}"></span>${esc(g.status||"—")}</span>
            ${g.genre?`<span class="chip">${esc(g.genre)}</span>`:""}
            ${g.variant?`<span class="chip" style="color:${vMeta(g.variant).c};border-color:${vMeta(g.variant).b}">◆ ${esc(g.variant)} — ${esc(g.variantDesc)}</span>`:""}
            ${g.market?`<span class="chip">🌍 ${esc(g.market)}</span>`:""}
            ${g.rtp?`<span class="chip">RTP ${esc(g.rtp)}</span>`:""}
          </div>
          ${sm.d?`<div style="margin-top:12px;font-size:12.5px;color:var(--txt3)">ⓘ ${esc(sm.d)}</div>`:""}
        </div>
      </div>
    </div>
    <div class="abody">
      <div class="acontent">
        ${g.description?`<div class="sec"><h4>📖 Overview</h4><p>${esc(g.description)}</p></div>`:""}
        ${editionsSection}
        ${featSection}
        ${certSection}
        ${langSection}
        ${themesChips.length?`<div class="sec"><h4>🏷️ Themes & Tags</h4><div class="flags">${themesChips.map(t=>`<span class="flag" style="background:rgba(245,196,81,.1);border-color:rgba(245,196,81,.3);color:var(--gold)">${esc(t)}</span>`).join("")}</div></div>`:""}
        ${namesSection}
        ${linkSection}
      </div>
      <aside class="infobox">
        <div class="ib-head">Vital Statistics</div>
        <div class="ib-big">
          <div class="cell"><div class="lab">RTP</div><div class="num">${esc(rtpDisp)}</div></div>
          <div class="cell"><div class="lab">Max Win</div><div class="num">${esc(g.maxWin||"—")}</div></div>
        </div>
        ${ibRows.map(r=>`<div class="ib-row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}
      </aside>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  document.querySelector(".article").scrollTop=0;
  document.body.style.overflow="hidden";
  location.hash=encodeURIComponent(g.identifier||g.name);
}
function closeArticle(){document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow="";history.replaceState(null,"",location.pathname);}

// ---- events ----
const qEl=document.getElementById("q");
qEl.addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
document.getElementById("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==="Escape"){if(document.getElementById("overlay").classList.contains("open"))closeArticle();}
});

async function init(){
  renderStatusDefinitions();
  buildSearchIndex();
  renderStats();render();
  try{
    const sheetGames=await loadGoogleSheet();
    if(sheetGames.length){
      GAMES=sheetGames;
      buildSearchIndex();
      renderStats();render();
      setDataSourceStatus("live", `Live sheet connected (${GAMES.length})`);
      if(location.hash){
        const id=decodeURIComponent(location.hash.slice(1));
        const idx=GAMES.findIndex(g=>(g.identifier||g.name)===id);
        if(idx>=0)openArticle(idx);
      }
    }else{
      setDataSourceStatus("error", "Sheet loaded but had no rows; using backup");
    }
  }catch(err){
    console.warn(err);
    setDataSourceStatus("error", "Sheet access blocked; using backup data");
  }
}
init();
// deep link
if(location.hash){const id=decodeURIComponent(location.hash.slice(1));
  const idx=GAMES.findIndex(g=>(g.identifier||g.name)===id);if(idx>=0)openArticle(idx);}
</script>
